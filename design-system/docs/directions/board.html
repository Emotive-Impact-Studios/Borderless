<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:1040px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  --ink:#1D1D1F;--muted:#6E6E73;--alex:#0A84FF;--maya:#FF9F0A;--sam:#30B07A;--robin:#FF375F;--jamie:#8E5CF6;--live:#FF3B30}

header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}

.grid{display:grid;grid-template-columns:1120px 1fr;gap:40px}

.w{position:absolute;display:flex;flex-direction:column}
.content{position:relative;flex:1;overflow:hidden}
.art{position:absolute;inset:0;background:
 radial-gradient(60% 80% at 20% 30%,#5b8cff 0,transparent 60%),radial-gradient(60% 70% at 85% 70%,#ff7a59 0,transparent 60%),radial-gradient(50% 60% at 60% 20%,#b45cff 0,transparent 60%),#3d4bd6}

.slide span{font-size:12px;color:var(--muted)}

.join{position:absolute;right:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;font-size:12px;color:var(--muted)}

.qr{width:40px;height:40px;border-radius:6px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/10px 10px}
.ripple{position:absolute;border-radius:50%;border:2px solid var(--robin);opacity:.35}
/* phone */
.phone{width:290px;height:600px;border-radius:52px;padding:10px;background:linear-gradient(145deg,#5d5f64,#232427 45%,#3f4145);box-shadow:0 30px 60px rgba(0,0,0,.25);margin:6px auto 0}
.ps{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--pbg);padding:58px 20px 22px;display:flex;flex-direction:column;gap:14px}

.dest{display:flex;gap:8px;flex-wrap:wrap}

.pbtn{margin-top:auto;height:52px;display:grid;place-items:center;font:600 16px Inter}
.hint{text-align:center;font-size:12px;color:var(--muted)}

.strip{display:grid;grid-template-columns:1fr 360px;gap:40px;margin-top:30px;align-items:start}
.comps{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{height:44px;padding:0 20px;display:inline-grid;place-items:center;font:600 15px Inter}

.owners{display:flex}

  const col = D==='instrument'?'#FF375F':'#FF375F';

  <path d="M 330 640 C 420 520, 520 470, 650 430" stroke="url(#g)" stroke-width="${D==='instrument'?2:5}" fill="none" ${D==='instrument'?'stroke-dasharray="6 6"':'filter="url(#b)"'}/>${D!=='instrument'?'<path d="M 330 640 C 420 520, 520 470, 650 430" stroke="url(#g)" stroke-width="1.5" fill="none"/>':''}
  ${D==='instrument'?'':Array.from({length:26},(_,i)=>{const t=i/26,x=330+(650-330)*t+Math.sin(i*1.7)*14,y=640-(640-430)*(1-Math.pow(1-t,1.5))+Math.cos(i*2.3)*10;return `<circle cx="${x}" cy="${y}" r="${1+t*2.2}" fill="${col}" opacity="${t*.85}"/>`}).join('')}</svg>`;
  h+=`<div class="tools glassy"><i class="on">${icons.pointer}</i><i>${icons.pen}</i><i>${icons.shape}</i><i>${icons.text}</i><i>${icons.layout}</i></div>`;
  h+=`<div class="join glassy"><div>Join the room<b>TE54D3</b></div><div class="qr"></div></div>`;
  if(D==='instrument'){h+=`<div style="position:absolute;left:14px;top:10px;font:500 10px 'JetBrains Mono';letter-spacing:.12em;color:rgba(0,0,0,.4)">WALL A · 3840×2160 · 5 SOURCES</div>`}
  return h;
}
