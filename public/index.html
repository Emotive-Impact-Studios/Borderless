<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5ef" />
    <meta
      name="description"
      content="One room. Every screen. Borderless brings files, ideas, live screens and people together on a shared canvas."
    />
    <title>Borderless · Make room for every idea</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <span class="brand-mark">b.</span>
        <p>Making room…</p>
      </div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <input
      type="file"
      id="file-input"
      hidden
      accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.csv,.json,.mp4,.webm,.mov,.mp3,.wav,.m4a,.ogg,.docx,.pptx,.xlsx"
      multiple
    />
  </body>
</html>
